<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass Folders · ui-taste</title>
<meta name="description" content="Frosted-glass folders that hold cards. 当卡片可以收纳。">
<link rel="stylesheet" href="glass-folders.css">
<style>
  :root{--bg:#14161b;--ink:#f2f2f2;--mute:#6f727a}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background-color:var(--bg);color:var(--ink);font:400 13px/1.6 "Inter",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:22px 22px;background-position:11px 11px;
    display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;-webkit-font-smoothing:antialiased}
  header,footer{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;color:var(--mute);position:relative;z-index:5}
  header a,footer a{color:inherit;text-decoration:none}
  header a:hover,footer a:hover{color:var(--ink)}
  .brand{font-weight:600;color:var(--ink);letter-spacing:-.01em}
  .brand span{color:var(--mute);font-weight:400}
  main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:58px;padding-top:150px}
  .fit{transform-origin:50% 100%}
  .hint{font:11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.28em;color:#80838b;text-transform:uppercase;display:flex;gap:14px;align-items:center;min-height:28px}
  .hint button{all:unset;cursor:pointer;letter-spacing:.12em;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:#ddd;display:none}
  .hint button.on{display:inline-block}
  body.embed header,body.embed footer{display:none}
  body.embed{grid-template-rows:1fr}
  body.embed main{padding-top:170px}
</style>
</head>
<body>
<script>if(/[?&]embed=1/.test(location.search))document.body.classList.add('embed')</script>
<header>
  <a class="brand" href="../../index.html">ui-taste <span>/ Glass Folders</span></a>
  <a href="https://github.com/Oldleeo/ui-taste/tree/main/components/glass-folders" target="_blank" rel="noopener">Source ↗</a>
</header>
<main>
  <div class="fit" id="fit"><div id="folders"></div></div>
  <div class="hint"><span id="hintText">Hover to lean · Click to open · + to add</span><button id="restore" type="button">Restore</button></div>
</main>
<footer>
  <span>Idea by VG Studio · 小红书「当卡片可以收纳」</span>
  <span>Built by Oldlee · MIT</span>
</footer>
<script src="glass-folders.js"></script>
<script>
  // Procedural artwork, no image files.
  const svg = s => `url("data:image/svg+xml,${encodeURIComponent(s)}") center/cover`;
  const marble = svg(`<svg xmlns='http://www.w3.org/2000/svg' width='600' height='344'><filter id='n'><feTurbulence type='turbulence' baseFrequency='.006 .022' numOctaves='5' seed='11'/><feColorMatrix values='0 0 0 0 .08  0 0 0 0 .08  0 0 0 0 .08  -3.2 -3.2 0 0 1.25'/></filter><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#f1f0ec'/><stop offset='1' stop-color='#b9b8b4'/></linearGradient><rect width='100%' height='100%' fill='url(#g)'/><rect width='100%' height='100%' filter='url(#n)'/></svg>`);
  const silk = svg(`<svg xmlns='http://www.w3.org/2000/svg' width='680' height='544'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#7fb3a6'/><stop offset='.5' stop-color='#2c5a52'/><stop offset='1' stop-color='#0b1110'/></linearGradient><filter id='b'><feGaussianBlur stdDeviation='9'/></filter></defs><rect width='100%' height='100%' fill='#0c0e0e'/><path d='M180 210 C 300 40, 430 120, 520 160 S 650 300, 700 270' stroke='url(#g)' stroke-width='38' fill='none' filter='url(#b)' opacity='.9'/><path d='M200 205 C 310 70, 430 130, 515 170 S 640 290, 700 262' stroke='#d8fff4' stroke-width='5' fill='none' opacity='.55' filter='url(#b)'/><path d='M120 60 C 260 10, 380 0, 460 40' stroke='#1f3a35' stroke-width='40' fill='none' filter='url(#b)'/></svg>`);
  const room = 'radial-gradient(circle at 70% 34%,#ffd27a 0 3px,rgba(255,170,70,.55) 5px,transparent 22px),radial-gradient(circle at 92% 30%,#ffd27a 0 3px,rgba(255,170,70,.5) 5px,transparent 20px),radial-gradient(circle at 58% 30%,#ffcf73 0 3px,rgba(255,170,70,.45) 5px,transparent 18px),radial-gradient(circle at 92% 62%,#ffd27a 0 3px,rgba(255,170,70,.5) 5px,transparent 20px),linear-gradient(90deg,transparent 57%,rgba(0,0,0,.6) 57% 58%,transparent 58%),linear-gradient(0deg,transparent 40%,#2a2620 40% 41%,transparent 41%),linear-gradient(180deg,#5a4a38,#2a221a 55%,#14100c)';
  const white = 'linear-gradient(180deg,#f6f6f7,#e4e4e7)';

  const cards = {
    sculpture: 'radial-gradient(circle at 60% 58%,transparent 26px,#c9a35c 27px 30px,transparent 31px),radial-gradient(ellipse at 70% 70%,#3a3a3a,#0c0c0c 70%)',
    crema: 'radial-gradient(circle at 50% 120%,#f2d7a8 0 14%,#b67b3e 30%,#5a3418 52%,#1b0f08 75%)',
    aggregate: marble,
    aurora: 'radial-gradient(ellipse at 30% 90%,rgba(120,255,200,.55),transparent 55%),radial-gradient(ellipse at 80% 70%,rgba(80,120,255,.6),transparent 55%),linear-gradient(180deg,#0b1430,#1a2f6b 60%,#0e2a3a)',
    kino: 'linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.55)),repeating-linear-gradient(90deg,#7c0f10 0 9px,#b3221b 13px,#5c0a0b 22px)',
    pressing: 'radial-gradient(circle at 72% 64%,#d9d9d9 0 5px,#111 6px 20px,transparent 21px),repeating-radial-gradient(circle at 72% 64%,#1b1b1b 0 2px,#0a0a0a 3px 4px),#050505',
    fluff: 'radial-gradient(circle at 63% 52%,#f6c94a 0 3px,transparent 4px),radial-gradient(circle at 75% 52%,#f6c94a 0 3px,transparent 4px),radial-gradient(ellipse at 68% 62%,#2b2b2b 0 22%,#151515 40%,transparent 41%),radial-gradient(ellipse at 70% 100%,#e9e9e9 0 16%,transparent 17%),#060606',
    aperture: 'repeating-radial-gradient(circle at 50% 70%,#2a3442 0 6px,#6f8296 8px,#1a2029 12px),#111',
    origin: 'radial-gradient(circle at 30% 70%,#ffb06b,transparent 30%),radial-gradient(circle at 70% 55%,#ff7a3a,transparent 28%),radial-gradient(circle at 55% 85%,#ffd59b,transparent 25%),#2a140b'
  };

  const ui = new GlassFolders(document.getElementById('folders'), {
    folders: [
      { title:'Selected work', theme:'frost', cover:room, action:'add', cards:[
        { title:'Sculpture', sub:'液态雕塑', bg:cards.sculpture },
        { title:'Crema', sub:'意式浓缩', bg:cards.crema },
        { title:'Atelier', sub:'工作室', bg:cards.aperture },
        { title:'Aggregate', sub:'骨料', bg:cards.aggregate } ] },
      { title:'Studio archive', theme:'light', cover:white, action:'menu', cards:[
        { title:'Aurora', sub:'极光冥想', bg:cards.aurora },
        { title:'Kino', sub:'修复影院', bg:cards.kino },
        { title:'Pressing', sub:'独立唱片', bg:cards.pressing },
        { title:'Fluff', sub:'猫洗护', bg:cards.fluff } ] },
      { title:'Latest', meta:'10 / 2026', theme:'dark', cover:silk, align:'right', cards:[
        { title:'Aperture', sub:'镜头研究', bg:cards.aperture },
        { title:'Origin', sub:'原点', bg:cards.origin },
        { title:'Price list.pdf', sub:'PDF · 480 KB', doc:true } ] }
    ],
    onChange: (ev, i) => {
      const r = document.getElementById('restore');
      if (ev === 'trash') { r.classList.add('on'); r.onclick = () => { ui.restore(i); r.classList.remove('on'); }; }
    }
  });

  // Fit all three folders on one screen, never scroll.
  const fit = document.getElementById('fit');
  function resize(){
    const need = 3*340 + 2*56 + 48, avail = innerWidth;
    const hNeed = 272 + 300, hAvail = innerHeight - (document.body.classList.contains('embed') ? 40 : 130);
    let s = Math.min(1, avail/need, hAvail/hNeed);
    if (innerWidth < 760) { document.getElementById('folders').style.flexDirection='column'; document.getElementById('folders').style.gap='150px'; s = Math.min(1,(innerWidth-24)/360,(innerHeight-120)/(3*272+300+150)); }
    else { document.getElementById('folders').style.flexDirection=''; document.getElementById('folders').style.gap=''; }
    fit.style.transform = `scale(${s})`;
  }
  addEventListener('resize', resize); resize();
</script>
</body>
</html>
