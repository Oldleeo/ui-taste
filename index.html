<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ui-taste · 老李的 UI 审美收藏</title>
<meta name="description" content="Small, carefully made UI interactions, recreated from the best ideas I come across. Vanilla JS, zero dependencies.">
<style>
  :root{--bg:#f0f0f0;--card:#fafafa;--ink:#111;--mute:#8d8d8d;--line:rgba(0,0,0,.07)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:400 14px/1.6 "Inter",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:72px 24px 48px}
  h1{font-size:44px;line-height:1.05;letter-spacing:-.035em;font-weight:650;margin:0 0 14px}
  h1 em{font-style:normal;color:var(--mute);font-weight:400}
  .lead{max-width:560px;color:#555;font-size:15px;margin:0}
  .lead span{display:block;color:var(--mute);font-size:13.5px;margin-top:6px}
  .top{display:flex;gap:10px;margin-top:22px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-size:13px}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-top:56px}
  .tile{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.04);display:flex;flex-direction:column}
  .preview{position:relative;height:300px;background:#f0f0f0}
  .preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .meta{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 18px;border-top:1px solid var(--line)}
  .meta h3{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
  .meta p{margin:2px 0 0;color:var(--mute);font-size:12.5px}
  .meta .links{display:flex;gap:12px;white-space:nowrap;font-size:12.5px}
  .meta a{color:var(--mute);text-decoration:none}.meta a:hover{color:var(--ink)}
  .tag{display:inline-block;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-right:4px}
  .soon{display:flex;align-items:center;justify-content:center;color:var(--mute);border:1px dashed rgba(0,0,0,.12);border-radius:18px;min-height:200px;font-size:13px;text-align:center;padding:24px}
  footer{max-width:1080px;margin:0 auto;padding:24px;color:var(--mute);font-size:12px;display:flex;justify-content:space-between}
  footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1>ui-taste <em>/ 老李的 UI 审美收藏</em></h1>
  <p class="lead">Small, carefully made UI interactions, recreated from the best ideas I come across. Vanilla JS, zero dependencies, copy and use.
    <span>把刷到的好交互一个个复刻出来，原生 JS、零依赖，拿去就能用。</span></p>
  <div class="top">
    <a class="btn" href="https://github.com/Oldleeo/ui-taste" target="_blank" rel="noopener">GitHub ↗</a>
    <a class="btn ghost" href="#list" id="count">Components</a>
  </div>
  <div class="grid" id="list"></div>
</div>
<footer><span>Built by Oldlee · MIT</span><span>Ideas belong to their designers, credited on each piece.</span></footer>
<script>
  // Add new components here.
  const COMPONENTS = [
    { slug:'wheel-dropdown', name:'Wheel Dropdown', zh:'滚轮下拉',
      desc:'A dropdown that opens in place as a wheel, with a ticking sound.', tags:['select','motion','sound'],
      credit:{ name:'@omer_assa', url:'https://ohwow.design' } },
  ];
  const list = document.getElementById('list');
  document.getElementById('count').textContent = COMPONENTS.length + (COMPONENTS.length>1?' components':' component');
  COMPONENTS.forEach(c=>{
    const t = document.createElement('article'); t.className='tile';
    t.innerHTML = `<div class="preview"><iframe loading="lazy" title="${c.name}" src="components/${c.slug}/index.html?embed=1"></iframe></div>
      <div class="meta"><div><h3>${c.name} · ${c.zh}</h3><p>${c.desc}</p>
      <p style="margin-top:8px">${c.tags.map(x=>`<span class="tag">${x}</span>`).join('')}</p></div>
      <div class="links"><a href="components/${c.slug}/index.html">Demo ↗</a><a href="https://github.com/Oldleeo/ui-taste/tree/main/components/${c.slug}" target="_blank" rel="noopener">Code</a></div></div>`;
    list.appendChild(t);
  });
  const s = document.createElement('div'); s.className='soon'; s.textContent='More soon · 持续收录中'; list.appendChild(s);
</script>
</body>
</html>
